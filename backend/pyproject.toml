[project]
name = "nexus-ai-backend"
version = "0.1.0"
description = "Local LLM gateway with RAM-aware model routing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "fastembed>=0.4",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
